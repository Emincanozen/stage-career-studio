name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        working-directory: skills/stage-career-studio/scripts
        run: python -m unittest test_stage_studio
      - name: Dashboard tests
        working-directory: skills/stage-career-studio/scripts
        run: node test_dashboard.cjs
