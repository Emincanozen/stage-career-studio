<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Spheres -->
  <circle cx="160" cy="80" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="190" r="150" fill="#38bdf8" opacity="0.13" filter="url(#glow)"/>
  <circle cx="620" cy="300" r="120" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#334155" stroke-opacity="0.6"/>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Category Pill -->
    <rect width="270" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981"/>
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.5">INTERNSHIP &amp; PFE PIPELINE</text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Stage Career Studio
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      Evidence-Based Internship Sourcing, Fit Scoring &amp; Tailored Application Suite
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b">
      Strict Fact-Checking Registry · Verifiable 4-Criteria Fit Scores · Zero AI Hallucination
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 182)">
      <!-- Badge 1: Fact Registry -->
      <rect width="144" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🎯 Fact Registry</text>

      <!-- Badge 2: 4-Criteria Fit Score -->
      <rect x="154" width="142" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="225" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">📊 Fit Scoring /10</text>

      <!-- Badge 3: Tailored CV & Letters -->
      <rect x="306" width="154" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="383" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">📁 Bespoke Dossiers</text>

      <!-- Badge 4: Local-First & Air-Gapped -->
      <rect x="470" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="540" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">🔒 100% Local-First</text>
    </g>
  </g>

  <!-- Right Side Interactive Dashboard Preview Mockup -->
  <g transform="translate(770, 36)">
    <!-- Main Dashboard Card Background -->
    <rect width="366" height="268" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M0 14 Q0 0 14 0 H352 Q366 0 366 14 V34 H0 Z" fill="#0f172a"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="17" r="4.5" fill="#eab308"/>
    <circle cx="50" cy="17" r="4.5" fill="#22c55e"/>
    <text x="183" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">STAGE CAREER STUDIO — TRACKER</text>

    <!-- Top KPI Stats Row -->
    <g transform="translate(16, 46)">
      <rect width="102" height="42" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">18</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b">Offres conservées</text>

      <rect x="114" width="104" height="42" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="126" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#10b981">7</text>
      <text x="126" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b">Candidatures</text>

      <rect x="230" width="104" height="42" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="242" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">3</text>
      <text x="242" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748b">Entretiens prévus</text>
    </g>

    <!-- Offer Item 1: BNP Paribas -->
    <g transform="translate(16, 100)">
      <rect width="334" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#10b981"/>
      
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">BNP Paribas · PFE Data Science &amp; ML</text>
      <rect x="250" y="8" width="74" height="18" rx="4" fill="#10b981" fill-opacity="0.18"/>
      <text x="287" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Envoyée</text>

      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Paris (75) · Durée : 6 mois · Début : Mars 2027</text>
      
      <!-- Score Pill -->
      <rect x="14" y="44" width="70" height="16" rx="4" fill="#334155"/>
      <text x="49" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">★ 9.0 / 10</text>
      <text x="94" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">CV v2 + Lettre ciblée vérifiés</text>
    </g>

    <!-- Offer Item 2: Ubisoft -->
    <g transform="translate(16, 174)">
      <rect width="334" height="66" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#3b82f6"/>
      
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Ubisoft · Dev Outils &amp; Python / C++</text>
      <rect x="250" y="8" width="74" height="18" rx="4" fill="#3b82f6" fill-opacity="0.18"/>
      <text x="287" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Entretien</text>

      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Montreuil (93) · Début : Février 2027</text>
      
      <!-- Score Pill -->
      <rect x="14" y="44" width="70" height="16" rx="4" fill="#334155"/>
      <text x="49" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">★ 9.0 / 10</text>
      <text x="94" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Test technique prévu 21/11</text>
    </g>
  </g>
</svg>
